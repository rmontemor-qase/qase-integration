# Secrets: QASE_API_TOKEN (Settings > Secrets and variables > Actions > Secrets).
# Variables: BASE_URL, QASE_PROJECT (Settings > Secrets and variables > Actions > Variables).
# No inputs required — safe to trigger from external platforms.

name: Qase Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      QASE_PROJECT: ${{ vars.QASE_PROJECT }}
      QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
      QASE_MODE: testops

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test --config=playwright.config.example.js

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
