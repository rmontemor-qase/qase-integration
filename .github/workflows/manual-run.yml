# Manually-triggered test run — NOT triggered from Qase.
# Because no run id is passed in, the playwright-qase-reporter CREATES the Qase
# run itself, so run-level configurations are applied at creation. We send the
# git branch and a link to this workflow run as Qase configurations via the
# reporter's env vars (no API step / elevated token needed).
name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which test suite to run'
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - core-regression
          - full-regression

jobs:
  manual:
    runs-on: ubuntu-latest
    env:
      QASE_MODE: testops
      QASE_TESTOPS_PROJECT: DAT
      QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
      QASE_TESTOPS_RUN_COMPLETE: true
      QASE_TESTOPS_RUN_TITLE: "Manual ${{ inputs.suite }} run — ${{ github.ref_name }}"
      # Branch goes in as a Qase configuration — a clean, repeating dimension.
      QASE_TESTOPS_CONFIGURATIONS_CREATE_IF_NOT_EXISTS: true
      QASE_TESTOPS_CONFIGURATIONS_VALUES: "Branch=${{ github.ref_name }}"
      # The workflow link goes in the run description, which renders markdown, so
      # it shows as a clickable "GitHub Build" label instead of a raw URL.
      # (Configuration values are plain text and can't be custom-labelled links.)
      QASE_TESTOPS_RUN_DESCRIPTION: "[GitHub Build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run ${{ inputs.suite }} tests
        run: npx playwright test --project=${{ inputs.suite }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-${{ inputs.suite }}-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-${{ inputs.suite }}-test-results
          path: test-results/
          retention-days: 30
